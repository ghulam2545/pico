<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="app">
<header>
    <strong id="ws-name">Pico</strong>
    <div class="right">
        <span id="health"></span>
        <button id="logout">Log out</button>
    </div>
</header>

<div class="layout">
    <aside>
        <button id="new-convo" class="full">+ New chat</button>
        <ul id="convos"></ul>
    </aside>

    <main>
        <div id="messages"></div>
        <p id="msg" class="error"></p>
        <form id="chat-form">
            <label for="query"></label><input id="query" placeholder="Ask about your documents..." autocomplete="off"
                                              required>
            <button id="send">Send</button>
        </form>
    </main>

    <aside>
        <form id="upload-form">
            <input type="file" id="file" accept=".pdf,.docx,.md,.txt" required>
            <button class="full">Upload</button>
        </form>
        <select id="doc-filter">
            <option value="">All documents</option>
        </select>
        <ul id="docs"></ul>
    </aside>
</div>
<script src="/static/js/app.js"></script>
<script src="/static/js/workspace.js"></script>
</body>
</html>
