<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="center">
<main class="card">
    <h1>Pico</h1>
    <p class="muted">Chat with your documents.</p>

    <h2>Open workspace</h2>
    <form id="enter-form">
        <input id="enter-identifier" placeholder="Identifier" required value="name000">
        <input id="enter-key" type="password" placeholder="API key" required value="7fb8d94bdc054165b4a290f330e5e14ab73ce12c76ee39b1a67dc3a8c8634fb8">
        <button>Open</button>
    </form>

    <h2>New workspace</h2>
    <form id="create-form">
        <input id="create-name" placeholder="Name" required>
        <input id="create-identifier" placeholder="identifier (a-z, 0-9, -)" pattern="[a-z0-9\-]+" required>
        <button>Create</button>
    </form>

    <p id="msg" class="error"></p>
    <div id="created" hidden>
        <p>Save this API key, it is shown only once:</p>
        <code id="created-key"></code>
        <p><a id="created-link" href="#">Open workspace &rarr;</a></p>
    </div>
</main>
<script src="/static/js/app.js"></script>
</body>
</html>
